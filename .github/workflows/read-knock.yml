name: Read Knock

on:
  workflow_dispatch:

# The workflow's normal GITHUB_TOKEN gets no repository permissions.
permissions: {}

jobs:
  read-knock:
    runs-on: ubuntu-latest

    steps:
      - name: Read rate-limit knock
        env:
          RATE_PROBE_TOKEN: ${{ secrets.RATE_PROBE_TOKEN }}
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS \
            -H "Authorization: Bearer $RATE_PROBE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/rate_limit)

          echo "$RESPONSE" | jq '{
            used: .resources.core.used,
            remaining: .resources.core.remaining,
            reset: .resources.core.reset
          }'
